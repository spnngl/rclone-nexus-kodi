name: Release

on:
  push:
    tags:
      - "plugin.ariostv-*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check tag matches addon.xml version
        run: |
          version=$(python -c "import xml.etree.ElementTree as ET; print(ET.parse('addon.xml').getroot().get('version'))")
          test "${GITHUB_REF_NAME}" = "plugin.ariostv-${version}" || { echo "Tag ${GITHUB_REF_NAME} does not match addon.xml version ${version}"; exit 1; }
      - name: Validate source
        run: python scripts/validate.py
      - name: Build installable ZIP
        run: python scripts/build_release.py
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --generate-notes --title "Rclone Nexus ${GITHUB_REF_NAME#plugin.ariostv-}"
